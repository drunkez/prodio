[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:icecast]
command=/usr/bin/icecast2 -c /etc/icecast2/icecast.xml
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/icecast.log
stderr_logfile=/var/log/supervisor/icecast.err

[program:liquidsoap]
command=/usr/bin/liquidsoap /app/liquidsoap/radio.liq
autostart=true
autorestart=true
priority=20
startsecs=3
stdout_logfile=/var/log/supervisor/liquidsoap.log
stderr_logfile=/var/log/supervisor/liquidsoap.err
environment=ICECAST_HOST="%(ENV_ICECAST_HOST)s",ICECAST_PORT="%(ENV_ICECAST_PORT)s",ICECAST_SOURCE_PASSWORD="%(ENV_ICECAST_SOURCE_PASSWORD)s",ICECAST_MOUNT="%(ENV_ICECAST_MOUNT)s",STATION_NAME="%(ENV_STATION_NAME)s",STATION_DESCRIPTION="%(ENV_STATION_DESCRIPTION)s",STATION_GENRE="%(ENV_STATION_GENRE)s",PRODIO_ONAIR_PLAYLIST="%(ENV_PRODIO_ONAIR_PLAYLIST)s"

[program:api]
command=/usr/local/bin/uvicorn app.main:app --host 0.0.0.0 --port 8080 --app-dir /app/backend
directory=/app/backend
autostart=true
autorestart=true
priority=30
startsecs=2
stdout_logfile=/var/log/supervisor/api.log
stderr_logfile=/var/log/supervisor/api.err
environment=ICECAST_HOST="%(ENV_ICECAST_HOST)s",ICECAST_PORT="%(ENV_ICECAST_PORT)s",ICECAST_SOURCE_PASSWORD="%(ENV_ICECAST_SOURCE_PASSWORD)s",ICECAST_ADMIN_PASSWORD="%(ENV_ICECAST_ADMIN_PASSWORD)s",ICECAST_MOUNT="%(ENV_ICECAST_MOUNT)s",STATION_NAME="%(ENV_STATION_NAME)s",STATION_DESCRIPTION="%(ENV_STATION_DESCRIPTION)s",STATION_GENRE="%(ENV_STATION_GENRE)s",PRODIO_ADMIN_USER="%(ENV_PRODIO_ADMIN_USER)s",PRODIO_ADMIN_PASSWORD="%(ENV_PRODIO_ADMIN_PASSWORD)s",PRODIO_SECRET_KEY="%(ENV_PRODIO_SECRET_KEY)s",STREAM_PUBLIC_URL="%(ENV_STREAM_PUBLIC_URL)s",PRODIO_PUBLIC_URL="%(ENV_PRODIO_PUBLIC_URL)s",PRODIO_ONAIR_PLAYLIST="%(ENV_PRODIO_ONAIR_PLAYLIST)s"
